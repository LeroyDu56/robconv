[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robconv"
version = "0.2.0"
description = "Industrial robot program converter: ABB RAPID parser (V1), FANUC TP writer (V2, planned)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Enzo LEROY" }]
license-files = ["LICENSE"]
dependencies = []  # runtime: standard library only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
robconv = "robconv.cli:main"

[project.gui-scripts]
robconv-gui = "robconv.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Robot controllers stamp programs with naive local time: timezone rules do not apply.
ignore = ["DTZ"]
