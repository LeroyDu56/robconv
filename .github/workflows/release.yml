name: release

# Builds robconv.exe from a version tag (git tag v0.2.0 && git push origin v0.2.0)
# and publishes it, with its SHA-256, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller --onefile --windowed --name robconv --paths src packaging/robconv_app.py
      - name: Smoke test (no window)
        shell: pwsh
        run: |
          $env:ROBCONV_NO_GUI = "1"
          Copy-Item tests/fixtures/rapid/pick_and_place.mod $env:RUNNER_TEMP
          $p = Start-Process dist/robconv.exe -ArgumentList "$env:RUNNER_TEMP\pick_and_place.mod" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path "$env:RUNNER_TEMP\robconv_pick_and_place\MAIN.LS")) { exit 1 }
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/robconv.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  robconv.exe" | Out-File -Encoding ascii dist/robconv.exe.sha256
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME dist/robconv.exe dist/robconv.exe.sha256
          --title "robconv $env:GITHUB_REF_NAME" --notes-file packaging/release_notes.md
